<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E5E5E5"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="540" fill="url(#bgGrad)"/>
  <rect width="1280" height="540" fill="url(#grid)"/>

  <!-- Outer Structural Border -->
  <rect x="24" y="24" width="1232" height="492" rx="16" fill="none" stroke="#262626" stroke-width="1.5"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="200" cy="120" r="140" fill="#10B981" fill-opacity="0.06" filter="url(#glowGreen)"/>
  <circle cx="1080" cy="400" r="160" fill="#06B6D4" fill-opacity="0.06" filter="url(#glowCyan)"/>

  <!-- ================= TOP HEADER BAR ================= -->
  <g transform="translate(56, 52)">
    <!-- Logo Badge -->
    <rect width="44" height="44" rx="10" fill="#1C1C1C" stroke="#333333" stroke-width="1.2"/>
    <path d="M22 11L33 17V30L22 36L11 30V17L22 11Z" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="22" cy="23.5" r="3.5" fill="#10B981"/>
    <line x1="22" y1="15" x2="22" y2="20" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="22" y1="27" x2="22" y2="32" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Title & Metadata -->
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.04em">ANTIGRAVITY APEX</text>
    <text x="60" y="40" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="500" fill="#737373">FOR GOOGLE ANTIGRAVITY &amp; AI DEVELOPMENT DIRECTOR</text>

    <!-- Version & Status Pills -->
    <g transform="translate(940, 6)">
      <rect x="0" y="0" width="82" height="26" rx="13" fill="#1A1A1A" stroke="#333333" stroke-width="1"/>
      <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#A3A3A3">v1.0.0 OSS</text>

      <rect x="94" y="0" width="116" height="26" rx="13" fill="#062817" stroke="#059669" stroke-width="1"/>
      <circle cx="108" cy="13" r="3.5" fill="#10B981" filter="url(#glowGreen)"/>
      <text x="120" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34D399">1-CLICK SETUP</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="56" y1="120" x2="1224" y2="120" stroke="#222222" stroke-width="1"/>

  <!-- ================= HERO HEADLINE ================= -->
  <g transform="translate(56, 175)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.03em">
      Autonomous Multi-Agent Mission Control
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#888888" letter-spacing="-0.01em">
      17 Specialist Subagents • Deterministic FIFO Concurrency (Up to 6) • Closed-Loop Argon Escalation
    </text>
  </g>

  <!-- ================= 4 ARCHITECTURAL PILLARS (CARDS) ================= -->
  <g transform="translate(56, 260)">
    <!-- Card 1: 17 Roles Pool -->
    <rect x="0" y="0" width="274" height="210" rx="12" fill="url(#cardGrad)" stroke="#262626" stroke-width="1.2"/>
    <rect x="18" y="18" width="34" height="34" rx="8" fill="#0A2518" stroke="#10B981" stroke-width="1"/>
    <circle cx="35" cy="35" r="5" fill="#10B981"/>
    <text x="64" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981">ROLE POOL</text>
    <text x="64" y="47" font-family="-apple-system, sans-serif" font-size="11" fill="#737373">Tier Distribution</text>

    <text x="18" y="86" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">17 Specialist Roles</text>
    <text x="18" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#A3A3A3" width="238">
      Director (Flash High), Architect (Pro), QA, Security, Legal, Frontend, DevOps &amp; Data.
    </text>

    <!-- Mini Tags -->
    <g transform="translate(18, 164)">
      <rect x="0" y="0" width="88" height="22" rx="4" fill="#171717" stroke="#333" stroke-width="1"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">Flash 3.8</text>

      <rect x="96" y="0" width="80" height="22" rx="4" fill="#171717" stroke="#333" stroke-width="1"/>
      <text x="106" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">Pro-Tier</text>
    </g>

    <!-- Card 2: Concurrency & Supervisor -->
    <rect x="298" y="0" width="274" height="210" rx="12" fill="url(#cardGrad)" stroke="#262626" stroke-width="1.2"/>
    <rect x="316" y="18" width="34" height="34" rx="8" fill="#08283B" stroke="#06B6D4" stroke-width="1"/>
    <path d="M327 35L333 41L341 29" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
    <text x="362" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#06B6D4">CONCURRENCY</text>
    <text x="362" y="47" font-family="-apple-system, sans-serif" font-size="11" fill="#737373">FIFO Process Tree</text>

    <text x="316" y="86" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">6 Parallel Subagents</text>
    <text x="316" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#A3A3A3">
      FSM state supervisor, tree-kill cleanup, real-time stdout streaming, zero race conditions.
    </text>

    <g transform="translate(316, 164)">
      <rect x="0" y="0" width="112" height="22" rx="4" fill="#171717" stroke="#333" stroke-width="1"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06B6D4">Tree-Kill Guard</text>

      <rect x="120" y="0" width="100" height="22" rx="4" fill="#171717" stroke="#333" stroke-width="1"/>
      <text x="130" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A3A3A3">Zero-Zombie</text>
    </g>

    <!-- Card 3: Quality Gates & Argon -->
    <rect x="596" y="0" width="274" height="210" rx="12" fill="url(#cardGrad)" stroke="#262626" stroke-width="1.2"/>
    <rect x="614" y="18" width="34" height="34" rx="8" fill="#25123A" stroke="#A855F7" stroke-width="1"/>
    <polygon points="631,25 640,40 622,40" fill="none" stroke="#A855F7" stroke-width="1.8"/>
    <text x="660" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#A855F7">QUALITY GATES</text>
    <text x="660" y="47" font-family="-apple-system, sans-serif" font-size="11" fill="#737373">Multi-Tier &amp; Argon</text>

    <text x="614" y="86" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Intelligent Escalation</text>
    <text x="614" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#A3A3A3">
      18-point sanitized prompt packs, anti-spam cooldown, Gate 2b Legal audit, Argon L4 resolver.
    </text>

    <g transform="translate(614, 164)">
      <rect x="0" y="0" width="114" height="22" rx="4" fill="#171717" stroke="#333" stroke-width="1"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C084FC">Argon Closed-Loop</text>

      <rect x="122" y="0" width="88" height="22" rx="4" fill="#171717" stroke="#333" stroke-width="1"/>
      <text x="132" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">Gate 2b OK</text>
    </g>

    <!-- Card 4: Refero UI & Telemetry -->
    <rect x="894" y="0" width="274" height="210" rx="12" fill="url(#cardGrad)" stroke="#262626" stroke-width="1.2"/>
    <rect x="912" y="18" width="34" height="34" rx="8" fill="#2D1C08" stroke="#F59E0B" stroke-width="1"/>
    <rect x="922" y="28" width="14" height="14" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="958" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B">REFERO VERCEL</text>
    <text x="958" y="47" font-family="-apple-system, sans-serif" font-size="11" fill="#737373">Light &amp; Dark Modes</text>

    <text x="912" y="86" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Modern Design</text>
    <text x="912" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#A3A3A3">
      WebSocket streaming, zero-disk SQLite WAL caching, token analytics &amp; mobile responsive drawer.
    </text>

    <g transform="translate(912, 164)">
      <rect x="0" y="0" width="102" height="22" rx="4" fill="#171717" stroke="#333" stroke-width="1"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24">Light &amp; Dark</text>

      <rect x="110" y="0" width="112" height="22" rx="4" fill="#171717" stroke="#333" stroke-width="1"/>
      <text x="120" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A3A3A3">SQLite WAL</text>
    </g>
  </g>
</svg>
