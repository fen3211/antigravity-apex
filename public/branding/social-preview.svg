<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <!-- Background -->
  <rect width="1280" height="640" fill="#FAFAFA"/>
  
  <!-- Subtle Border & Grid Accent -->
  <rect x="32" y="32" width="1216" height="576" rx="16" fill="#FFFFFF" stroke="#EBEBEB" stroke-width="2"/>
  <line x1="32" y1="120" x2="1248" y2="120" stroke="#EBEBEB" stroke-width="1.5"/>

  <!-- Brand Mark -->
  <g transform="translate(72, 56)">
    <rect width="40" height="40" rx="8" fill="#171717"/>
    <path d="M20 9L29 14V26L20 31L11 26V14L20 9Z" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="20" cy="20" r="3" fill="#297A3A"/>
    <text x="56" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#171717" letter-spacing="-0.02em">ANTIGRAVITY APEX</text>
    <rect x="260" y="10" width="56" height="22" rx="4" fill="#F5F5F5" stroke="#EBEBEB" stroke-width="1"/>
    <text x="270" y="25" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#7D7D7D">v1.0.0</text>
  </g>

  <!-- Tagline & Description -->
  <text x="72" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#171717" letter-spacing="-0.03em">
    Multi-Agent Mission Control
  </text>
  <text x="72" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#7D7D7D" letter-spacing="-0.03em">
    for Antigravity AI Development Director
  </text>
  
  <text x="72" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" letter-spacing="-0.01em">
    Engineered for precision orchestration, 17 specialized roles, multi-tier quality gates, and real-time telemetry.
  </text>

  <!-- Feature Grid -->
  <g transform="translate(72, 360)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="260" height="180" rx="8" fill="#FAFAFA" stroke="#EBEBEB" stroke-width="1"/>
    <text x="24" y="36" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#297A3A">01 // TEAM HIERARCHY</text>
    <text x="24" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#171717">17 Specialist Roles</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#666666">Architects, engineers, QA, legal, security & domain specialists.</text>
    <rect x="24" y="132" width="90" height="24" rx="4" fill="#F4FBF6" stroke="#D3F0DC" stroke-width="1"/>
    <text x="34" y="148" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#297A3A">Flash / Pro</text>

    <!-- Box 2 -->
    <rect x="280" y="0" width="260" height="180" rx="8" fill="#FAFAFA" stroke="#EBEBEB" stroke-width="1"/>
    <text x="304" y="36" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#1D4ED8">02 // CONCURRENCY</text>
    <text x="304" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#171717">Up to 6 Subagents</text>
    <text x="304" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#666666">Deterministic FIFO queue, process tree lifecycle watchdog.</text>
    <rect x="304" y="132" width="110" height="24" rx="4" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="314" y="148" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#1D4ED8">Zero Lock Race</text>

    <!-- Box 3 -->
    <rect x="560" y="0" width="260" height="180" rx="8" fill="#FAFAFA" stroke="#EBEBEB" stroke-width="1"/>
    <text x="584" y="36" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#7E22CE">03 // QUALITY GATES</text>
    <text x="584" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#171717">Multi-Tier & Argon</text>
    <text x="584" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#666666">9-point verification reports, Legal Gate 2b, Argon L4 escalation.</text>
    <rect x="584" y="132" width="116" height="24" rx="4" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1"/>
    <text x="594" y="148" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#7E22CE">Closed-Loop</text>

    <!-- Box 4 -->
    <rect x="840" y="0" width="260" height="180" rx="8" fill="#FAFAFA" stroke="#EBEBEB" stroke-width="1"/>
    <text x="864" y="36" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#A16207">04 // TELEMETRY</text>
    <text x="864" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#171717">Zero-Disk Read</text>
    <text x="864" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#666666">Live SQLite token aggregation, streaming JSONL ingestion.</text>
    <rect x="864" y="132" width="126" height="24" rx="4" fill="#FEFCE8" stroke="#FEF08A" stroke-width="1"/>
    <text x="874" y="148" font-family="'Courier New', monospace" font-size="11" font-weight="600" fill="#A16207">Proven Live Data</text>
  </g>
</svg>
